description: >-
  Us2.ai is a Singapore-founded medical AI company (founded 2017 as eko.ai by
  James Hare, Dr. Carolyn Lam, and Dr. Yoran Hummel) whose FDA-cleared,
  CE-marked software fully automates echocardiography analysis — taking a
  routine DICOM echo study and returning a complete structured report with
  measurements, disease detection (heart failure, cardiac amyloidosis, aortic
  stenosis, pulmonary hypertension, strain), and findings in seconds, with
  zero clicks. The platform is vendor-neutral and DICOM-native, deploying via
  ultrasound OEMs (Fujifilm LISENDO 880), AI marketplaces (Viz.ai,
  Harrison.ai), cardiology PACS (Merge Cardio via DICOM-SR/HL7), or as a
  cloud-hosted service with an API for programmatic study submission and
  result retrieval used by research programs, imaging core labs, and pharma
  trials (partner-gated; no public API reference is published). Validated in
  150+ peer-reviewed publications, cleared in 28+ regulatory markets, and ISO
  13485 / ISO 27001:2022, SOC 2 Type II, MDSAP, HIPAA, and GDPR compliant.
  Backed by Partech, Sequoia India, EDBI, and IHH Healthcare.
